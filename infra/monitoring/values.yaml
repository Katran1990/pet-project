# Values for the "monitoring" Argo CD Application (infra/argocd/apps.yaml):
# prometheus-community/kube-prometheus-stack (version: targetRevision in apps.yaml), release
# "monitoring", namespace "monitoring".
# Rendered in CI by .github/workflows/ci.yml (job "Helm chart").
# The server has 14 GB RAM shared with the app: every component gets requests and a memory
# limit (no CPU limits, like infra/helm/pet-project/values.yaml), and unused parts are off.
# Never put a password here. Grafana's admin credentials come from the SealedSecret
# infra/monitoring/sealed-secrets/grafana-admin.yaml (README "Monitoring (kube-prometheus-stack)").
# The Wallet datasource credentials come from the SealedSecret
# infra/monitoring/sealed-secrets/grafana-postgres-reader.yaml
# (README "Grafana read-only user (grafana_reader)").

# Alerting is a separate card. Without Alertmanager, Prometheus gets no alerting section.
alertmanager:
  enabled: false

# k3s (k3d) runs these inside the k3s process, bound to localhost: the chart's Services would
# select no pods, leaving empty targets and permanently true "...Down" rules.
kubeControllerManager:
  enabled: false
kubeScheduler:
  enabled: false
kubeProxy:
  enabled: false
kubeEtcd:
  enabled: false

prometheus:
  prometheusSpec:
    retention: 15d
    # Safety net under the 20Gi volume: k3d's local-path volumes do not enforce their size,
    # so this is what caps disk usage (oldest blocks are deleted first).
    retentionSize: 18GiB
    storageSpec:
      volumeClaimTemplate:
        spec:
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 20Gi
    resources:
      requests: { cpu: 200m, memory: 1Gi }
      limits:   { memory: 2Gi }
    # Select every ServiceMonitor (serviceMonitorNamespaceSelector stays {} = all namespaces),
    # not only those labelled release=monitoring: the backend's ServiceMonitor lives in the
    # pet-project chart (namespaces dev and prod) and must not depend on this release name.
    serviceMonitorSelectorNilUsesHelmValues: false

prometheusOperator:
  resources:
    requests: { cpu: 50m, memory: 96Mi }
    limits:   { memory: 192Mi }

grafana:
  enabled: true
  admin:
    existingSecret: grafana-admin   # SealedSecret, see the header; keys below
    userKey: admin-user
    passwordKey: admin-password
  # Wallet datasource credentials from the Secret grafana-postgres-reader (SealedSecret
  # infra/monitoring/sealed-secrets/grafana-postgres-reader.yaml, applied by monitoring-secrets).
  # optional: Grafana and the JVM dashboards still start without it; only the Wallet panels fail.
  # Read at pod start: restart Grafana after a change (README).
  envValueFrom:
    GRAFANA_POSTGRES_READER_USER:
      secretKeyRef: { name: grafana-postgres-reader, key: username, optional: true }
    GRAFANA_POSTGRES_READER_PASSWORD:
      secretKeyRef: { name: grafana-postgres-reader, key: password, optional: true }
  # Read-only access to the prod database for the "Wallet" dashboard (role grafana_reader,
  # Flyway V6). Grafana expands the ${...} env references when it provisions the datasource.
  additionalDataSources:
    - name: Wallet (prod Postgres)
      uid: wallet-postgres            # referenced by infra/monitoring/dashboards/wallet.json
      type: grafana-postgresql-datasource
      access: proxy
      url: postgres.prod.svc.cluster.local:5432   # Service "postgres" of the pet-project chart
      user: ${GRAFANA_POSTGRES_READER_USER}
      jsonData:
        database: app                 # postgres.db of the pet-project chart
        sslmode: disable              # the in-cluster postgres:17 has no TLS
        postgresVersion: 1700         # postgres:17
      secureJsonData:
        password: ${GRAFANA_POSTGRES_READER_PASSWORD}
      editable: false
  ingress:
    enabled: true
    hosts:
      - grafana.pet.local           # add to /etc/hosts like dev.pet.local (README)
    path: /
  resources:
    requests: { cpu: 50m, memory: 256Mi }
    limits:   { memory: 512Mi }
  sidecar:
    # Applies to each sidecar container (dashboards and datasources)
    resources:
      requests: { cpu: 10m, memory: 96Mi }
      limits:   { memory: 192Mi }
    datasources:
      uid: prometheus             # chart default, spelled out: dashboards reference the Prometheus datasource by this uid
      alertmanager:
        enabled: false              # rendered even with alertmanager.enabled=false otherwise

kube-state-metrics:
  resources:
    requests: { cpu: 10m, memory: 64Mi }
    limits:   { memory: 128Mi }

prometheus-node-exporter:
  resources:
    requests: { cpu: 10m, memory: 32Mi }
    limits:   { memory: 64Mi }
