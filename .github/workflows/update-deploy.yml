# Runs after "Build images" succeeds. Writes the new image tag (short commit SHA)
# into envs/<env>/values.yaml in Katran1990/pet-project-deploy (branch main).
# Argo CD notices the commit and rolls out the new version.
#
#   development -> envs/dev/values.yaml
#   main        -> envs/prod/values.yaml
name: Update deploy manifests

on:
  workflow_run:
    workflows: ["Build images"]
    types: [completed]
    branches: [development, main]

permissions:
  contents: read         # the deploy repo is written with DEPLOY_REPO_TOKEN, not GITHUB_TOKEN

jobs:
  update:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    # Self-hosted (ADR 0021). workflow_run fires only after "Build images", which is push-only and
    # filtered to development/main, so no fork code runs here, and DEPLOY_REPO_TOKEN is not
    # available to forks anyway.
    runs-on: [self-hosted, home]
    timeout-minutes: 10
    steps:
      - name: Pick environment
        id: pick
        env:
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          case "$HEAD_BRANCH" in
            development) echo "name=dev"  >> "$GITHUB_OUTPUT" ;;
            main)        echo "name=prod" >> "$GITHUB_OUTPUT" ;;
            *) echo "unexpected branch: $HEAD_BRANCH"; exit 1 ;;
          esac
          # metadata-action's short SHA tag is the first 7 characters
          echo "tag=${HEAD_SHA:0:7}" >> "$GITHUB_OUTPUT"

      - name: Verify DEPLOY_REPO_TOKEN is set
        # Without this guard, a missing/empty token would make actions/checkout below
        # silently succeed as an anonymous checkout of the public deploy repo, and the
        # failure would only surface at the push step after three confusing retries.
        env:
          DEPLOY_REPO_TOKEN: ${{ secrets.DEPLOY_REPO_TOKEN }}
        run: |
          if [ -z "$DEPLOY_REPO_TOKEN" ]; then echo "DEPLOY_REPO_TOKEN is not set"; exit 1; fi

      # All workflows share one workspace on the persistent runner, and clean: true keeps an
      # existing .git/config and .git/hooks. Without this wipe, checkout would reuse a .git planted
      # by an earlier job (hooks, remote URL, insteadOf) and run it with DEPLOY_REPO_TOKEN in the
      # environment, so checkout must start from an empty directory (ADR 0021).
      - name: Empty the workspace before checkout
        run: find "${GITHUB_WORKSPACE:?}" -mindepth 1 -delete

      # The self-hosted host is persistent: an empty HOME and no system config keep a poisoned
      # ~/.gitconfig or /etc/gitconfig out of checkout's git calls (ADR 0021).
      - name: Create an empty HOME for checkout
        run: mkdir -p "${RUNNER_TEMP}/empty-home"

      # clean: true - the self-hosted runner reuses _work; the workspace was already emptied above,
      # so no earlier .git is reused
      - uses: actions/checkout@v6
        env:
          HOME: ${{ runner.temp }}/empty-home
          GIT_CONFIG_NOSYSTEM: "1"
        with:
          clean: true
          repository: Katran1990/pet-project-deploy
          ref: main
          token: ${{ secrets.DEPLOY_REPO_TOKEN }}
          persist-credentials: true   # keep the token in the checkout's git config so the push below authenticates
          fetch-depth: 0              # full history: the push step rebases, which is fragile on a shallow clone

      # The runner is a bare machine (ADR 0006): install yq explicitly. These values must equal
      # YQ_VERSION / YQ_SHA256 in ci.yml; bump both files together.
      - name: Install yq (pinned)
        env:
          YQ_VERSION: v4.54.1
          YQ_SHA256: 8e34fc298390875de416e6a4afcb8cabeceb25d9aa8506c1a2f9353cf702ea5f
        run: |
          bin="${RUNNER_TEMP}/bin"
          mkdir -p "${bin}"
          curl -fsSL --retry 3 -o "${bin}/yq" \
            "https://github.com/mikefarah/yq/releases/download/${YQ_VERSION}/yq_linux_amd64"
          echo "${YQ_SHA256}  ${bin}/yq" | sha256sum -c -
          chmod +x "${bin}/yq"
          "${bin}/yq" --version
          echo "${bin}" >> "$GITHUB_PATH"

      - name: Set image tags
        env:
          TAG: ${{ steps.pick.outputs.tag }}
          ENV_NAME: ${{ steps.pick.outputs.name }}
        run: |
          FILE="envs/${ENV_NAME}/values.yaml"
          yq -i ".backend.tag = strenv(TAG) | .frontend.tag = strenv(TAG)" "$FILE"
          # Credentials come from SealedSecrets in the chart, never from env values.
          # Refuse to print a values file that carries a password-like key, structurally
          # (any key in any document, however it is spelled/quoted/nested/styled). `ea`
          # (eval-all) evaluates every YAML document in the file as one stream, so a
          # multi-document file cannot hide a password key in one of its documents -
          # plain `yq -e` does not reliably fail when only one document matches. A yq
          # parse error also counts as "found" and fails closed, before `cat` below.
          if ! yq ea -e '[.. | select(key != null) | select((key | type) == "!!str") | select(key | test("(?i)password"))] | length == 0' "$FILE" >/dev/null 2>&1; then
            echo "::error::${FILE} contains a password key - remove it from the deploy repo"; exit 1
          fi
          cat "$FILE"

      # GIT_CONFIG_GLOBAL=/dev/null and GIT_CONFIG_NOSYSTEM keep a poisoned global or system git
      # config on the persistent host from redirecting the push or capturing the token. The
      # token itself lives in the checkout's repository-local config (and a file under
      # RUNNER_TEMP included from it), which is still read.
      - name: Commit and push
        env:
          GIT_CONFIG_GLOBAL: /dev/null
          GIT_CONFIG_NOSYSTEM: "1"
          ENV_NAME: ${{ steps.pick.outputs.name }}
          TAG: ${{ steps.pick.outputs.tag }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Stage exactly the file this run rewrote: the deploy repo is shared, and a
          # layout change must fail loudly instead of turning into a silent no-op.
          git add -- "envs/${ENV_NAME}/values.yaml"
          git diff --cached --quiet && { echo "nothing changed"; exit 0; }
          git commit -m "deploy(${ENV_NAME}): ${TAG}"
          # origin is the deploy repo. The dev and prod runs write to the same branch
          # and can collide; rebase onto whatever landed first and retry. The two runs
          # touch different files (envs/dev vs envs/prod), so the rebase is clean.
          for attempt in 1 2 3; do
            git push origin HEAD:main && exit 0
            echo "push rejected (attempt ${attempt}), rebasing onto origin/main"
            git pull --rebase origin main || { git rebase --abort; exit 1; }
          done
          echo "could not push to the deploy repo after 3 attempts"
          exit 1

      # The self-hosted runner is persistent: delete this job's working copy (the deploy repo
      # checkout and its .git/config) so no token-bearing state survives in the workspace under
      # _work. The token itself sits in a credentials file under RUNNER_TEMP (_work/_temp) that
      # .git/config includes. Deleting .git/config first makes checkout's post step return early,
      # so it no longer removes that file; hence the explicit removal below, run first so the
      # token file goes even if the workspace delete fails. The workspace
      # directory itself stays; the runner expects it to exist. always(): also after a failure
      # or cancellation.
      - name: Delete the working copy and checkout credentials
        if: always()
        run: |
          find "${RUNNER_TEMP:?}" -maxdepth 1 -name 'git-credentials-*' -delete
          find "${GITHUB_WORKSPACE:?}" -mindepth 1 -delete
