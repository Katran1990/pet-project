# Runs after "Build images" succeeds. Writes the new image tag (short commit SHA)
# into envs/<env>/values.yaml in Katran1990/pet-project-deploy (branch main).
# Argo CD notices the commit and rolls out the new version.
#
#   development -> envs/dev/values.yaml
#   main        -> envs/prod/values.yaml
name: Update deploy manifests

on:
  workflow_run:
    workflows: ["Build images"]
    types: [completed]
    branches: [development, main]

permissions:
  contents: read         # the deploy repo is written with DEPLOY_REPO_TOKEN, not GITHUB_TOKEN

jobs:
  update:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Pick environment
        id: pick
        env:
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          case "$HEAD_BRANCH" in
            development) echo "name=dev"  >> "$GITHUB_OUTPUT" ;;
            main)        echo "name=prod" >> "$GITHUB_OUTPUT" ;;
            *) echo "unexpected branch: $HEAD_BRANCH"; exit 1 ;;
          esac
          # metadata-action's short SHA tag is the first 7 characters
          echo "tag=${HEAD_SHA:0:7}" >> "$GITHUB_OUTPUT"

      - name: Verify DEPLOY_REPO_TOKEN is set
        # Without this guard, a missing/empty token would make actions/checkout below
        # silently succeed as an anonymous checkout of the public deploy repo, and the
        # failure would only surface at the push step after three confusing retries.
        env:
          DEPLOY_REPO_TOKEN: ${{ secrets.DEPLOY_REPO_TOKEN }}
        run: |
          if [ -z "$DEPLOY_REPO_TOKEN" ]; then echo "DEPLOY_REPO_TOKEN is not set"; exit 1; fi

      - uses: actions/checkout@v6
        with:
          repository: Katran1990/pet-project-deploy
          ref: main
          token: ${{ secrets.DEPLOY_REPO_TOKEN }}
          persist-credentials: true   # keep the token in the checkout's git config so the push below authenticates
          fetch-depth: 0              # full history: the push step rebases, which is fragile on a shallow clone

      - name: Set image tags
        env:
          TAG: ${{ steps.pick.outputs.tag }}
          ENV_NAME: ${{ steps.pick.outputs.name }}
        run: |
          # yq v4 (mikefarah) is preinstalled on ubuntu-latest runners
          FILE="envs/${ENV_NAME}/values.yaml"
          yq -i ".backend.tag = strenv(TAG) | .frontend.tag = strenv(TAG)" "$FILE"
          cat "$FILE"

      - name: Commit and push
        env:
          ENV_NAME: ${{ steps.pick.outputs.name }}
          TAG: ${{ steps.pick.outputs.tag }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Stage exactly the file this run rewrote: the deploy repo is shared, and a
          # layout change must fail loudly instead of turning into a silent no-op.
          git add -- "envs/${ENV_NAME}/values.yaml"
          git diff --cached --quiet && { echo "nothing changed"; exit 0; }
          git commit -m "deploy(${ENV_NAME}): ${TAG}"
          # origin is the deploy repo. The dev and prod runs write to the same branch
          # and can collide; rebase onto whatever landed first and retry. The two runs
          # touch different files (envs/dev vs envs/prod), so the rebase is clean.
          for attempt in 1 2 3; do
            git push origin HEAD:main && exit 0
            echo "push rejected (attempt ${attempt}), rebasing onto origin/main"
            git pull --rebase origin main || { git rebase --abort; exit 1; }
          done
          echo "could not push to the deploy repo after 3 attempts"
          exit 1
