# CI: runs on every pull request and on every push to development / main.
# Two independent jobs (backend, frontend) run in parallel.
name: CI

on:
  pull_request:
  push:
    branches: [development, main]

# The workflow only needs to read the repository.
permissions:
  contents: read

# If you push a new commit to the same PR, the previous run is cancelled.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Gradle)
    runs-on: ubuntu-latest        # GitHub runners have Docker, so Testcontainers works
    # Backend tests use Testcontainers (Postgres 17), which needs the runner's Docker daemon.
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"

      # Caches Gradle dependencies between runs and validates gradle-wrapper.jar
      - uses: gradle/actions/setup-gradle@v6

      - name: Build and test
        run: ./gradlew build --no-daemon

      # Test reports are kept for 7 days so you can inspect failures
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: backend-test-report
          path: backend/build/reports/tests/test
          retention-days: 7

  frontend:
    name: Frontend (Vite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci              # exact versions from package-lock.json

      - name: Lint
        run: npm run lint

      - name: Type-check and build
        run: npm run build
