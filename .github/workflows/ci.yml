# CI: runs on every pull request and on every push to development / main.
# Six independent jobs (backend, frontend, the Helm chart check, the Grafana dashboards check,
# actionlint and the Trivy dependency scan) run in parallel on separate runners, or one after
# another when only one runner instance is online.
#
# Runner selection (ADR 0021): every job runs on the self-hosted runner [self-hosted, home],
# except pull requests from forks, from a deleted fork and from Dependabot, which run on
# GitHub-hosted ubuntu-latest. Pushes and PRs from branches of this repository use the
# self-hosted runner. On push events github.event.pull_request is absent, so the condition is
# false and the self-hosted labels are used. The same runs-on expression is repeated in every
# job because runs-on cannot read the workflow-level env. Every future job triggered by
# pull_request must use the same expression.
# The expression is NOT a security boundary: a fork PR runs its own copy of this file and can
# change runs-on. The boundary is the repository setting "Require approval for all external
# contributors" (ADR 0021).
name: CI

on:
  pull_request:
  push:
    branches: [development, main]

# The workflow only needs to read the repository.
permissions:
  contents: read

# If you push a new commit to the same PR, the previous run is cancelled.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pinned CLI tools (ADR 0006): version plus SHA-256 of the linux amd64 release asset, taken
  # from the publisher's checksum file. Bump version and checksum together. update-deploy.yml
  # installs yq with the same values.
  YQ_VERSION: v4.54.1             # mikefarah/yq, asset yq_linux_amd64
  YQ_SHA256: 8e34fc298390875de416e6a4afcb8cabeceb25d9aa8506c1a2f9353cf702ea5f
  JQ_VERSION: 1.8.2               # jqlang/jq, asset jq-linux-amd64
  JQ_SHA256: b1c22172dd303f3be49e935aa56aa48a8b7a46e0bc838b4997d3bb451495870f
  KUSTOMIZE_VERSION: v5.6.0       # same version as the README's local kustomize command
  KUSTOMIZE_SHA256: 54e4031ddc4e7fc59e408da29e7c646e8e57b8088c51b84b3df0864f47b5148f  # kustomize_v5.6.0_linux_amd64.tar.gz

jobs:
  backend:
    name: Backend (Gradle)
    runs-on: ${{ github.event_name == 'pull_request' && (github.event.pull_request.head.repo.full_name != github.repository || github.event.pull_request.user.login == 'dependabot[bot]') && 'ubuntu-latest' || fromJSON('["self-hosted","home"]') }}
    timeout-minutes: 30
    # Backend tests use Testcontainers (Postgres 17), which needs the runner's Docker daemon
    # (host baseline, README "CI runner").
    defaults:
      run:
        working-directory: backend
    steps:
      # clean: true - the self-hosted runner reuses _work
      - uses: actions/checkout@v6
        with:
          clean: true
          persist-credentials: false

      # Pinned to the 25.0.4 patch line (ADR 0006): "25.0.4" resolves to the newest 25.0.4.x
      # Temurin build (as of 2026-10-05: jdk-25.0.4.1+1).
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25.0.4"

      # Caches Gradle dependencies between runs and validates gradle-wrapper.jar
      - uses: gradle/actions/setup-gradle@v6

      - name: Build and test
        run: ./gradlew build --no-daemon

      # Test reports are kept for 7 days so you can inspect failures
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: backend-test-report
          path: backend/build/reports/tests/test
          retention-days: 7

  frontend:
    name: Frontend (Vite)
    runs-on: ${{ github.event_name == 'pull_request' && (github.event.pull_request.head.repo.full_name != github.repository || github.event.pull_request.user.login == 'dependabot[bot]') && 'ubuntu-latest' || fromJSON('["self-hosted","home"]') }}
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      # clean: true - the self-hosted runner reuses _work
      - uses: actions/checkout@v6
        with:
          clean: true
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version: "24.21.0"       # exact pin (ADR 0006)
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci              # exact versions from package-lock.json

      - name: Lint
        run: npm run lint

      - name: Type-check and build
        run: npm run build

      # Vitest in run mode (no watch): component tests in jsdom with a mocked fetch,
      # so no backend or database is needed.
      - name: Test
        run: npm test

  helm:
    name: Helm chart
    runs-on: ${{ github.event_name == 'pull_request' && (github.event.pull_request.head.repo.full_name != github.repository || github.event.pull_request.user.login == 'dependabot[bot]') && 'ubuntu-latest' || fromJSON('["self-hosted","home"]') }}
    timeout-minutes: 5
    steps:
      # clean: true - the self-hosted runner reuses _work
      - uses: actions/checkout@v6
        with:
          clean: true
          persist-credentials: false

      # Environment values live in the deploy repo (see infra/argocd/apps.yaml), not here.
      # A stale nested deploy-values/ repo is already removed by the first checkout's
      # git clean -ffdx in this job.
      # Read-only checkout with the built-in token: the deploy repo is public, so no secret
      # is needed, and DEPLOY_REPO_TOKEN (write access) is deliberately kept out of PR jobs.
      # Works the same for PRs from forks and Dependabot. If the deploy repo ever becomes
      # private, this step fails with "repository not found" instead of skipping the check.
      - name: Check out environment values (pet-project-deploy)
        uses: actions/checkout@v6
        with:
          repository: Katran1990/pet-project-deploy
          ref: main
          path: deploy-values
          clean: true
          persist-credentials: false   # read-only: do not leave the token in .git/config
          sparse-checkout: envs

      # The self-hosted runner is a bare machine (ADR 0006): install yq explicitly. RUNNER_TEMP is
      # emptied by the runner at the start and end of every job, so nothing persists on the host.
      # GITHUB_PATH prepends, so on ubuntu-latest this binary wins over the preinstalled yq.
      - name: Install yq (pinned)
        run: |
          bin="${RUNNER_TEMP}/bin"
          mkdir -p "${bin}"
          curl -fsSL --retry 3 -o "${bin}/yq" \
            "https://github.com/mikefarah/yq/releases/download/${YQ_VERSION}/yq_linux_amd64"
          echo "${YQ_SHA256}  ${bin}/yq" | sha256sum -c -
          chmod +x "${bin}/yq"
          "${bin}/yq" --version
          echo "${bin}" >> "$GITHUB_PATH"

      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1, pinned by SHA (third-party action)
        with:
          version: v3.22.0              # pinned Helm 3.x; do not float to Helm 4

      # --namespace dev: the chart has no sealed Postgres credentials for "default",
      # so an unnamespaced lint would just log the resulting fail() as INFO noise.
      - name: Lint chart
        run: helm lint infra/helm/pet-project --namespace dev

      # Same lint with each environment's values: catches warnings that only appear with them.
      - name: Lint chart with dev and prod values
        run: |
          for env in dev prod; do
            helm lint infra/helm/pet-project --namespace "${env}" -f "deploy-values/envs/${env}/values.yaml"
          done

      # Renders the chart as Argo CD does on a cluster where the ServiceMonitor CRD exists
      # (chart + envs/<env>/values.yaml, plus --api-versions for the guarded ServiceMonitor),
      # and checks that the ServiceMonitor shows up. The path without the CRD (no
      # --api-versions) is covered by the helm lint steps above. The output is not printed:
      # postgres.yaml renders a SealedSecret (ciphertext only, safe either way). `helm template`
      # - not `helm lint` - is what actually enforces the sealed-file validation in
      # postgres.yaml (its fail() checks): helm lint only logs them as INFO. Errors go to
      # stderr and fail the step.
      - name: Render chart with dev and prod values
        run: |
          for env in dev prod; do
            echo "helm template with envs/${env}/values.yaml"
            out="${RUNNER_TEMP}/pet-project-${env}.yaml"
            helm template "pet-project-${env}" infra/helm/pet-project \
              --namespace "${env}" \
              --api-versions monitoring.coreos.com/v1/ServiceMonitor \
              -f "deploy-values/envs/${env}/values.yaml" > "${out}"
            grep -qx 'kind: ServiceMonitor' "${out}" \
              || { echo "::error::no ServiceMonitor rendered for ${env}"; exit 1; }
          done

      # Renders kube-prometheus-stack as the "monitoring" Argo CD Application does: same chart
      # version, release name and namespace as infra/argocd/apps.yaml, plus
      # infra/monitoring/values.yaml. --repo fetches the packaged chart (subcharts included),
      # so no `helm repo add` is needed. The yq checks (mikefarah yq v4, installed by the
      # "Install yq (pinned)" step above) fail the step unless apps.yaml pins the same chart
      # version for the "monitoring" Application, its `ref: values` source has no `path`, and the
      # "monitoring-secrets" Application applies infra/monitoring/sealed-secrets from main into
      # namespace monitoring, and the "monitoring-dashboards" Application applies
      # infra/monitoring/dashboards from main into namespace monitoring. Output goes to
      # /dev/null: it is several thousand lines.
      - name: Render kube-prometheus-stack with monitoring values
        env:
          KPS_VERSION: 91.9.0   # keep in sync with the "monitoring" Application in infra/argocd/apps.yaml
        run: |
          export KPS_VERSION
          yq -e 'select(.metadata.name == "monitoring") | .spec.sources[]
                 | select(.chart == "kube-prometheus-stack" and .targetRevision == strenv(KPS_VERSION))' \
            infra/argocd/apps.yaml > /dev/null \
            || { echo "::error::apps.yaml: Application monitoring must use chart kube-prometheus-stack at ${KPS_VERSION}"; exit 1; }
          yq -e 'select(.metadata.name == "monitoring") | .spec.sources[]
                 | select(.ref == "values" and .path == null)' infra/argocd/apps.yaml > /dev/null \
            || { echo "::error::apps.yaml: the ref: values source of monitoring must have no path"; exit 1; }
          yq -e 'select(.metadata.name == "monitoring-secrets") | .spec
                 | select(.destination.namespace == "monitoring" and .source.path == "infra/monitoring/sealed-secrets" and .source.targetRevision == "main")' \
            infra/argocd/apps.yaml > /dev/null \
            || { echo "::error::apps.yaml: Application monitoring-secrets must apply infra/monitoring/sealed-secrets from main into namespace monitoring"; exit 1; }
          yq -e 'select(.metadata.name == "monitoring-dashboards") | .spec
                 | select(.destination.namespace == "monitoring" and .source.path == "infra/monitoring/dashboards" and .source.targetRevision == "main")' \
            infra/argocd/apps.yaml > /dev/null \
            || { echo "::error::apps.yaml: Application monitoring-dashboards must apply infra/monitoring/dashboards from main into namespace monitoring"; exit 1; }
          helm template monitoring kube-prometheus-stack \
            --repo https://prometheus-community.github.io/helm-charts \
            --version "${KPS_VERSION}" \
            --namespace monitoring \
            -f infra/monitoring/values.yaml > /dev/null

  dashboards:
    name: Grafana dashboards
    runs-on: ${{ github.event_name == 'pull_request' && (github.event.pull_request.head.repo.full_name != github.repository || github.event.pull_request.user.login == 'dependabot[bot]') && 'ubuntu-latest' || fromJSON('["self-hosted","home"]') }}
    timeout-minutes: 5
    steps:
      # clean: true - the self-hosted runner reuses _work
      - uses: actions/checkout@v6
        with:
          clean: true
          persist-credentials: false

      # jq, yq (mikefarah v4) and kustomize are installed by the pinned steps below (ADR 0006).
      - name: Install jq (pinned)
        run: |
          bin="${RUNNER_TEMP}/bin"
          mkdir -p "${bin}"
          curl -fsSL --retry 3 -o "${bin}/jq" \
            "https://github.com/jqlang/jq/releases/download/jq-${JQ_VERSION}/jq-linux-amd64"
          echo "${JQ_SHA256}  ${bin}/jq" | sha256sum -c -
          chmod +x "${bin}/jq"
          "${bin}/jq" --version
          echo "${bin}" >> "$GITHUB_PATH"

      # Same install pattern as in the helm job.
      - name: Install yq (pinned)
        run: |
          bin="${RUNNER_TEMP}/bin"
          mkdir -p "${bin}"
          curl -fsSL --retry 3 -o "${bin}/yq" \
            "https://github.com/mikefarah/yq/releases/download/${YQ_VERSION}/yq_linux_amd64"
          echo "${YQ_SHA256}  ${bin}/yq" | sha256sum -c -
          chmod +x "${bin}/yq"
          "${bin}/yq" --version
          echo "${bin}" >> "$GITHUB_PATH"

      - name: Install kustomize (pinned)
        run: |
          bin="${RUNNER_TEMP}/bin"
          mkdir -p "${bin}"
          curl -fsSL --retry 3 -o "${RUNNER_TEMP}/kustomize.tar.gz" \
            "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2F${KUSTOMIZE_VERSION}/kustomize_${KUSTOMIZE_VERSION}_linux_amd64.tar.gz"
          echo "${KUSTOMIZE_SHA256}  ${RUNNER_TEMP}/kustomize.tar.gz" | sha256sum -c -
          tar -xzf "${RUNNER_TEMP}/kustomize.tar.gz" -C "${bin}" kustomize
          "${bin}/kustomize" version
          echo "${bin}" >> "$GITHUB_PATH"

      # Each dashboard must be valid JSON with a uid and a title, and must not
      # carry grafana.com import inputs (__inputs / ${DS_...}): the Grafana sidecar does not resolve
      # them. The jq program is in single quotes, so the shell never expands the "${DS_" in it, and
      # shellcheck's SC2016 ("expressions don't expand in single quotes") exempts jq programs.
      - name: Validate dashboard JSON
        run: |
          shopt -s nullglob
          files=(infra/monitoring/dashboards/*.json)
          [ "${#files[@]}" -gt 0 ] || { echo "::error::no dashboards in infra/monitoring/dashboards"; exit 1; }
          for f in "${files[@]}"; do
            jq -e '(.uid | type == "string" and length > 0)
                   and (.title | type == "string" and length > 0)
                   and (has("__inputs") | not)
                   and ([.. | strings | select(contains("${DS_"))] | length == 0)' "$f" > /dev/null \
              || { echo "::error file=${f}::invalid JSON, missing uid/title, or unresolved import inputs"; exit 1; }
          done
          dup="$(jq -r .uid "${files[@]}" | sort | uniq -d)"
          [ -z "${dup}" ] || { echo "::error::duplicate dashboard uid(s): ${dup}"; exit 1; }

      # Renders the ConfigMaps exactly as Argo CD does (kustomize) and checks that every JSON file
      # ends up in a ConfigMap in namespace monitoring with the sidecar label grafana_dashboard=1.
      - name: Render dashboard ConfigMaps (kustomize)
        run: |
          out="${RUNNER_TEMP}/dashboards.yaml"
          kustomize build infra/monitoring/dashboards > "${out}"
          for f in infra/monitoring/dashboards/*.json; do
            NAME="$(basename "${f}")" yq -e 'select(.kind == "ConfigMap" and .metadata.namespace == "monitoring"
                   and .metadata.labels.grafana_dashboard == "1" and (.data | has(strenv(NAME))))' "${out}" > /dev/null \
              || { echo "::error file=${f}::not rendered into a labelled ConfigMap (kustomization.yaml)"; exit 1; }
          done

  dependency-scan:
    name: Dependencies (Trivy)
    runs-on: ${{ github.event_name == 'pull_request' && (github.event.pull_request.head.repo.full_name != github.repository || github.event.pull_request.user.login == 'dependabot[bot]') && 'ubuntu-latest' || fromJSON('["self-hosted","home"]') }}
    timeout-minutes: 10
    # Job-level permissions replace the workflow-level block, which is why
    # contents: read is listed again here, alongside security-events: write
    # (only this job uploads SARIF).
    permissions:
      contents: read
      security-events: write
    steps:
      # clean: true - the self-hosted runner reuses _work
      - uses: actions/checkout@v6
        with:
          clean: true
          persist-credentials: false

      # No JDK or Node setup: Trivy reads backend/gradle.lockfile and
      # frontend/package-lock.json directly.

      # Report run 1/2 (SARIF, all severities, never fails): feeds the Security tab.
      - name: Scan dependencies (SARIF report)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0, pinned by SHA (third-party action)
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          format: sarif
          output: trivy-fs.sarif
          ignore-unfixed: true
          trivyignores: .trivyignore
          exit-code: "0"
          version: v0.70.0
        env:
          TRIVY_INCLUDE_DEV_DEPS: true

      # Report run 2/2 (table, all severities, never fails): feeds the job summary.
      # Reuses the DB and the installed Trivy binary from the previous step.
      - name: Scan dependencies (table report)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0, pinned by SHA (third-party action)
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          format: table
          output: trivy-fs.txt
          ignore-unfixed: true
          trivyignores: .trivyignore
          exit-code: "0"
          version: v0.70.0
          skip-setup-trivy: true
          # Disable actions/cache restore/save here: it is not gated by skip-setup-trivy,
          # so it would restore an older cached DB over the fresh one from the previous
          # step and re-save it, pinning the gate to a stale DB forever.
          cache: "false"
        env:
          TRIVY_INCLUDE_DEV_DEPS: true
          TRIVY_SKIP_DB_UPDATE: true

      # Visible on every PR, including forks and Dependabot, where SARIF upload is not allowed.
      - name: Add findings to job summary
        run: |
          {
            echo "## Dependency scan (Trivy)"
            echo '```'
            cat trivy-fs.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # Fork and Dependabot PRs get a read-only token, so the upload would fail there.
      # continue-on-error: the gate below still fails the job on its own if this upload fails.
      - name: Upload SARIF to the Security tab
        if: github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login != 'dependabot[bot]')
        uses: github/codeql-action/upload-sarif@v4
        continue-on-error: true
        with:
          sarif_file: trivy-fs.sarif
          category: trivy-fs

      # Gate: fails the job on HIGH/CRITICAL fixed findings and prints them in the log.
      - name: Fail on HIGH/CRITICAL
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0, pinned by SHA (third-party action)
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          trivyignores: .trivyignore
          exit-code: "1"
          version: v0.70.0
          skip-setup-trivy: true
          cache: "false"
        env:
          TRIVY_INCLUDE_DEV_DEPS: true
          TRIVY_SKIP_DB_UPDATE: true

  actionlint:
    name: Workflow lint (actionlint)
    runs-on: ${{ github.event_name == 'pull_request' && (github.event.pull_request.head.repo.full_name != github.repository || github.event.pull_request.user.login == 'dependabot[bot]') && 'ubuntu-latest' || fromJSON('["self-hosted","home"]') }}
    timeout-minutes: 5
    steps:
      # clean: true - the self-hosted runner reuses _work
      - uses: actions/checkout@v6
        with:
          clean: true
          persist-credentials: false

      # Checks every file in .github/workflows/ (actionlint's default when run from the repo root),
      # including the shell in run: blocks via shellcheck, which is bundled in the official image.
      - name: actionlint
        uses: docker://rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
        with:
          args: -color
