# Builds Docker images and pushes them to GHCR (GitHub Container Registry).
# Runs only after code lands in development or main, i.e. after you merged a PR.
#
# Resulting images:
#   ghcr.io/<owner>/<repo>/backend:<tag>
#   ghcr.io/<owner>/<repo>/frontend:<tag>
# where <tag> is the branch name (development / main) and the commit SHA.
name: Build images

on:
  push:
    branches: [development, main]

permissions:
  contents: read
  packages: write        # needed to push to GHCR

# Newest push wins: the branch tag is never overwritten by an older, slower build.
concurrency:
  group: build-images-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  # <owner>/<repo>. GHCR requires lowercase names; docker/metadata-action lowercases
  # the image name, so do not use IMAGE_PREFIX directly as a tag elsewhere.
  IMAGE_PREFIX: ghcr.io/${{ github.repository }}

jobs:
  build:
    name: Build ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [backend, frontend]     # one job per service, run in parallel
    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}   # built-in token, nothing to configure

      # Generates tags: branch name + short commit SHA
      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_PREFIX }}/${{ matrix.service }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=,format=short

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.service }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Reuse layers between runs, scoped per service so the two matrix
          # jobs do not evict each other's cache
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
