# Builds Docker images and pushes them to GHCR (GitHub Container Registry).
# Runs only after code lands in development or main, i.e. after you merged a PR.
#
# Each image is scanned with Trivy before it is pushed. A failed scan blocks the
# push of that image, and therefore also blocks "Update deploy manifests" for it
# (it only runs after this workflow succeeds). Matrix legs run in parallel with the
# default fail-fast: one leg may already have pushed its image before the other
# leg's gate fails and cancels it, so a failed run does not mean nothing was pushed.
#
# Resulting images:
#   ghcr.io/<owner>/<repo>/backend:<tag>
#   ghcr.io/<owner>/<repo>/frontend:<tag>
# where <tag> is the branch name (development / main) and the commit SHA.
name: Build images

on:
  push:
    branches: [development, main]

permissions:
  contents: read
  packages: write        # needed to push to GHCR

# Newest push wins: the branch tag is never overwritten by an older, slower build.
concurrency:
  group: build-images-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  # <owner>/<repo>. GHCR requires lowercase names; docker/metadata-action lowercases
  # the image name, so do not use IMAGE_PREFIX directly as a tag elsewhere.
  IMAGE_PREFIX: ghcr.io/${{ github.repository }}

jobs:
  build:
    name: Build ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [backend, frontend]     # one job per service, run in parallel
    # Job-level permissions replace the workflow-level block above, so all three
    # are listed here: security-events: write is only needed to upload SARIF.
    permissions:
      contents: read
      packages: write
      security-events: write
    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-buildx-action@v4

      # Generates tags: branch name + short commit SHA
      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_PREFIX }}/${{ matrix.service }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=,format=short

      # Build and load into the runner's Docker engine, under the final GHCR tags,
      # but do not push yet: the image is scanned first.
      - name: Build image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.service }}
          push: false
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Reuse layers between runs, scoped per service so the two matrix
          # jobs do not evict each other's cache
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

      # Report run 1/2 (SARIF, all severities, never fails): feeds the Security tab.
      - name: Scan image (SARIF report)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0, pinned by SHA (third-party action)
        with:
          scan-type: image
          image-ref: ${{ fromJSON(steps.meta.outputs.json).tags[0] }}
          scanners: vuln
          format: sarif
          output: trivy-image.sarif
          ignore-unfixed: true
          trivyignores: .trivyignore
          exit-code: "0"
          version: v0.70.0
        env:
          # Scan the local image built above, never pull the old branch tag from GHCR.
          TRIVY_IMAGE_SRC: docker

      # Report run 2/2 (table, all severities, never fails): feeds the job summary.
      # Reuses the DB, Java DB and the installed Trivy binary from the previous step.
      - name: Scan image (table report)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0, pinned by SHA (third-party action)
        with:
          scan-type: image
          image-ref: ${{ fromJSON(steps.meta.outputs.json).tags[0] }}
          scanners: vuln
          format: table
          output: trivy-image.txt
          ignore-unfixed: true
          trivyignores: .trivyignore
          exit-code: "0"
          version: v0.70.0
          skip-setup-trivy: true
          # Disable actions/cache restore/save here: it is not gated by skip-setup-trivy,
          # so it would restore an older cached DB over the fresh one from the previous
          # step and re-save it, pinning the gate to a stale DB forever.
          cache: "false"
        env:
          TRIVY_IMAGE_SRC: docker
          TRIVY_SKIP_DB_UPDATE: true
          TRIVY_SKIP_JAVA_DB_UPDATE: true

      - name: Add findings to job summary
        env:
          SERVICE: ${{ matrix.service }}
        run: |
          {
            echo "## Image scan (Trivy) - $SERVICE"
            echo '```'
            cat trivy-image.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # No fork guard needed: this workflow only runs on push, never on pull_request.
      # continue-on-error: the gate below still fails the job on its own if this upload fails.
      - name: Upload SARIF to the Security tab
        uses: github/codeql-action/upload-sarif@v4
        continue-on-error: true
        with:
          sarif_file: trivy-image.sarif
          category: trivy-image-${{ matrix.service }}

      # Gate: fails the job on HIGH/CRITICAL fixed findings and prints them in the log.
      - name: Fail on HIGH/CRITICAL
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0, pinned by SHA (third-party action)
        with:
          scan-type: image
          image-ref: ${{ fromJSON(steps.meta.outputs.json).tags[0] }}
          scanners: vuln
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          trivyignores: .trivyignore
          exit-code: "1"
          version: v0.70.0
          skip-setup-trivy: true
          cache: "false"
        env:
          TRIVY_IMAGE_SRC: docker
          TRIVY_SKIP_DB_UPDATE: true
          TRIVY_SKIP_JAVA_DB_UPDATE: true

      # Log in only after the image has passed the gate: the write-capable registry
      # login exists only once there is something safe to push.
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}   # built-in token, nothing to configure

      # Push exactly the image that was scanned above. A second build-push-action
      # run would re-resolve base image tags and could push something different
      # from what was scanned; `docker push` of the already-loaded image cannot.
      - name: Push scanned image
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          while IFS= read -r tag; do
            if [ -n "$tag" ]; then docker push "$tag"; fi
          done <<< "$TAGS"
