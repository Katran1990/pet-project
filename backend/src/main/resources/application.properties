spring.application.name=pet

# Virtual threads: plain blocking code, no WebFlux
spring.threads.virtual.enabled=true

# Database connection is taken from the environment.
# The defaults point at the dev container Postgres and are for local development only.
spring.datasource.url=${DB_URL:jdbc:postgresql://postgres:5432/app}
spring.datasource.username=${DB_USER:app}
spring.datasource.password=${DB_PASSWORD:app}

# How long to wait for Postgres on startup before failing (see README "Configuration")
app.db.startup-wait.timeout=${DB_STARTUP_WAIT_TIMEOUT:60s}
app.db.startup-wait.interval=${DB_STARTUP_WAIT_INTERVAL:2s}

# Flyway owns the schema, Hibernate must not touch it
spring.jpa.hibernate.ddl-auto=none

management.endpoints.web.exposure.include=health,info
