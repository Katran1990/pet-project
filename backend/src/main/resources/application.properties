spring.application.name=pet

# Virtual threads: plain blocking code, no WebFlux
spring.threads.virtual.enabled=true

# Database connection is taken from the environment.
# The defaults point at the dev container Postgres and are for local development only.
spring.datasource.url=${DB_URL:jdbc:postgresql://postgres:5432/app}
spring.datasource.username=${DB_USER:app}
spring.datasource.password=${DB_PASSWORD:app}

# How long to wait for Postgres on startup before failing (see README "Configuration")
app.db.startup-wait.timeout=${DB_STARTUP_WAIT_TIMEOUT:60s}
app.db.startup-wait.interval=${DB_STARTUP_WAIT_INTERVAL:2s}

# Flyway owns the schema, Hibernate must not touch it
spring.jpa.hibernate.ddl-auto=none

# API errors are RFC 9457 Problem Details (see ApiExceptionHandler)
spring.mvc.problemdetails.enabled=true

# Zone in which "today" is evaluated, e.g. an expense's spentOn must not be after today (see README "Configuration")
app.time-zone=${APP_TIME_ZONE:Europe/Warsaw}

# Actuator over HTTP: health for the Kubernetes probes, prometheus for metrics scraping
# (Micrometer, Prometheus text format). Deliberately unauthenticated: the Ingress routes to
# the frontend and its nginx forwards only /api/ to the backend, so this endpoint is meant
# for in-cluster scraping (see README "Deploy (Helm + Argo CD)").
management.endpoints.web.exposure.include=health,info,prometheus

# Metrics for the Grafana dashboards: latency histograms for HTTP server requests
# (histogram_quantile for p95/p99) and a common "application" tag on every meter.
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.metrics.tags.application=${spring.application.name}

# JSON integer fields (categoryId, sortOrder) reject every floating-point number token,
# including whole values such as 7.0 or 1e1, instead of truncating or converting them
spring.jackson.deserialization.accept-float-as-int=false
