# nginx config for the production frontend image.
# Serves the Vite build and forwards /api to the backend service.
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Exactly two actuator endpoints are reachable from outside, for the post-deploy e2e
    # workflow (ADR 0022): health (UP/DOWN) and info (the deployed git commit). Exact-match
    # locations win over the /api/ prefix and match nothing else; every other /api/actuator/...
    # still goes through /api/ to the backend's /api/actuator/..., which does not exist (404).
    location = /api/actuator/health {
        proxy_pass http://backend:8080/actuator/health;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location = /api/actuator/info {
        proxy_pass http://backend:8080/actuator/info;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # API calls go to the backend. "backend" is the service name
    # in docker compose and later in Kubernetes. nginx resolves this
    # hostname once, when it loads the config, so it exits with
    # "host not found in upstream" if the name does not resolve at
    # startup. This is acceptable because the image always runs next
    # to a service named "backend", which resolves even before that
    # service is ready to accept connections.
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Single-page app: unknown paths fall back to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache hashed build assets for a long time
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
