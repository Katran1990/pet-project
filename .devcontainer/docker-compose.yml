services:

  # Container that runs Claude Code and all the build tools
  dev:
    image: mcr.microsoft.com/devcontainers/base:ubuntu-24.04
    command: sleep infinity
    environment:
      # Claude Code login and settings are stored in a volume and survive rebuilds
      CLAUDE_CONFIG_DIR: /home/vscode/.claude
    volumes:
      # The only folder on your Mac that the container can see
      - ..:/workspace:cached
      # node_modules only live inside the container (incompatible between Mac and Linux)
      - frontend-node-modules:/workspace/frontend/node_modules
      - claude-config:/home/vscode/.claude
      - gradle-cache:/home/vscode/.gradle

  # Database for development. Reachable from the dev container as postgres:5432
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: app
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app   # for local development only
    ports:
      # To connect from IDEA on Mac. 127.0.0.1 = not visible from the network
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Redis will be added later — uncomment when needed for caching
  # redis:
  #   image: redis:7
  #   ports:
  #     - "127.0.0.1:6379:6379"

volumes:
  frontend-node-modules:
  claude-config:
  gradle-cache:
  pgdata:
